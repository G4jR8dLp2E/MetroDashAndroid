
name: Build Metro Dash APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -o MetroDashAndroid_3D_Fix_Project.zip

      - name: Build APK
        working-directory: MetroDashAndroid
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Metro-Dash-3D-APK
          path: MetroDashAndroid/app/build/outputs/apk/debug/app-debug.apk
          
